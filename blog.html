<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Blogs | Public Domain Books Archive</title>
  <meta name="description" content="Explore classic literature, literary criticism, deep-dive essays, and updates on gothic fiction, poetry, and masterpieces shaping the literary world.">
  <link rel="canonical" href="https://3nding.top">
  <meta name="robots" content="index, follow">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://3nding.top">
  <meta property="og:title" content="PDBA Blog | Classic Literature and Timeless Prose">
  <meta property="og:description" content="Explore classic literature, literary criticism, deep-dive essays, and updates on gothic fiction, poetry, and masterpieces shaping the literary world.">

  <link rel="icon" href="apple-touch-icon.png" type="image/png">
  <link rel="preload" href="fonts/outfit.woff2" as="font" type="font/woff2" crossorigin>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "PDBA Blog",
      "url": "https://3nding.top",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://3nding.top/?s={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>

  <script>
    (function () {
      const saved = JSON.parse(localStorage.getItem('reader_prefs') || '{}');
      document.documentElement.setAttribute('data-theme', saved.theme || 'light');
    })();
  </script>

  <style>
    /* ─── Light (default — mirrors index.html) ─── */
    :root {
      --bg-main: #fcfcfc;
      --bg-card: #f3f3f0;
      --bg-card-hover: #eae9e3;
      --border: #e4e4e0;
      --border-hover: #a0a09a;
      --text-main: #1a1a1a;
      --text-muted: #737373;
      --accent: #8b0000;
      --accent-dim: rgba(139, 0, 0, .08);
      --bg-gradient: rgba(228, 228, 224, 0.5);
      --header-bg: rgba(252, 252, 252, 0.88);
      --input-bg: rgba(0, 0, 0, .03);
      --input-bg-focus: rgba(0, 0, 0, .06);
      --text-placeholder: #a8a8a8;
      --tag-bg: rgba(0, 0, 0, .05);
      --pill-text: #3a3a3a;
      --radius: 12px;
      --transition: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ─── Sepia ─── */
    [data-theme="sepia"] {
      --bg-main: #f5efe3;
      --bg-card: #ede5d5;
      --bg-card-hover: #e2d8c4;
      --border: #d8cdb8;
      --border-hover: #a89070;
      --text-main: #3b2a1a;
      --text-muted: #8a7060;
      --accent: #7a4a1e;
      --accent-dim: rgba(122, 74, 30, .08);
      --bg-gradient: rgba(216, 205, 184, 0.4);
      --header-bg: rgba(245, 239, 227, 0.88);
      --input-bg: rgba(0, 0, 0, .03);
      --input-bg-focus: rgba(0, 0, 0, .06);
      --text-placeholder: #b8a090;
      --tag-bg: rgba(0, 0, 0, .06);
      --pill-text: #5a3a20;
    }

    /* ─── Dark ─── */
    [data-theme="dark"] {
      --bg-main: #141414;
      --bg-card: #1e1e1e;
      --bg-card-hover: #262626;
      --border: #2a2a2a;
      --border-hover: #525252;
      --text-main: #ddd8cc;
      --text-muted: #6e6e6e;
      --accent: #c0392b;
      --accent-dim: rgba(192, 57, 43, .10);
      --bg-gradient: rgba(30, 30, 30, 0.3);
      --header-bg: rgba(20, 20, 20, 0.88);
      --input-bg: rgba(255, 255, 255, .03);
      --input-bg-focus: rgba(255, 255, 255, .08);
      --text-placeholder: #525252;
      --tag-bg: rgba(255, 255, 255, .06);
      --pill-text: #d4d4d8;
    }

    * {
      font-family: 'Outfit', Georgia, serif;
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      line-height: 1.6;
      color: var(--text-main);
      background-color: var(--bg-main);
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(circle at top center, var(--bg-gradient) 0%, transparent 50%);
      background-repeat: no-repeat
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
      background: var(--header-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px)
    }

    nav {
      max-width: 1200px;
      margin: 0 auto;
      height: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px
    }

    .logo {
      font-weight: 800;
      letter-spacing: -.02em;
      text-decoration: none;
      color: var(--text-main);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .logo::before {
      content: '';
      display: block;
      width: 12px;
      height: 12px;
      background: var(--accent);
      border-radius: 2px;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: .9rem;
      font-weight: 500;
      margin-left: 28px;
      transition: color 0.2s
    }

    .nav-links a:hover {
      color: var(--text-main)
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 1;
      visibility: visible;
      transition: opacity var(--transition), visibility var(--transition);
    }

    .modal-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* Modal Content */
    .modal-content {
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      transform: translateY(0);
      transition: transform var(--transition);
    }

    .modal-overlay.hidden .modal-content {
      transform: translateY(20px);
    }

    /* Modal Header */
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-header h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      transition: color var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .apply-btn {
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      background: var(--text-main);
      /* High contrast */
      color: var(--bg-main);
      border: none;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity var(--transition), transform 0.2s;
    }

    .apply-btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .apply-btn:active {
      transform: translateY(0);
    }

    /* Floating Action Button */
    .fab {
      position: fixed;
      bottom: 40px;
      right: 40px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 999;
      transition: transform var(--transition), background var(--transition), border-color var(--transition);
    }

    .fab:hover {
      transform: scale(1.05);
      background: var(--bg-card-hover);
      border-color: var(--text-main);
    }

    /* Adjusted Controls for Modal */
    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 0;
      padding: 0;
    }

    .search-input,
    .filter-select {
      width: 100%;
      max-width: none;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 14px 20px;
      border-radius: var(--radius);
      font-size: .95rem;
      outline: none;
      transition: all var(--transition);
      box-shadow: 0 2px 10px rgb(0 0 0 / .05)
    }

    .search-input {
      flex: 1;
      min-width: 250px;
      max-width: 400px
    }

    .filter-select {
      min-width: 150px;
      cursor: pointer;
      appearance: none;
      background-image: url(data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a1a1a1%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E);
      background-repeat: no-repeat;
      background-position: right 16px top 50%;
      background-size: 10px auto;
      padding-right: 40px
    }

    .search-input:focus,
    .filter-select:focus {
      border-color: var(--accent);
      background: var(--input-bg-focus);
      box-shadow: 0 0 0 4px var(--accent-dim)
    }

    .search-input::placeholder {
      color: var(--text-placeholder)
    }

    .grid-container {
      max-width: 1200px;
      margin: 20px auto 40px;
      /* Added 60px top margin */
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 56px 40px;
    }

    .card {
      background: transparent;
      border: none;
      border-top: 1px solid transparent;
      padding: 24px 0 0 0;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Expanding accent top border on hover */
    .card::before {
      content: '';
      position: absolute;
      top: -1px;
      /* perfectly overlap the top border */
      left: 0;
      width: 0%;
      height: 2px;
      background: var(--text-main);
      transition: width var(--transition);
    }

    .card:hover::before {
      width: 100%;
    }

    /* Fluid content indent on hover */
    .card>* {
      transition: transform var(--transition);
    }

    .card:hover>* {
      transform: translateX(8px);
    }

    .card-header {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
    }

    .category-tag {
      font-size: .75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .category-tag::before {
      content: '';
      display: block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: background var(--transition), transform var(--transition);
    }

    .card:hover .category-tag::before {
      background: var(--text-main);
      transform: scale(1.5);
    }

    .card-title {
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: -.01em;
      color: var(--text-main);
      margin-bottom: 12px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-excerpt {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      flex-grow: 1;
      line-height: 1.65;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .published-tag {
      font-size: .8rem;
      font-weight: 400;
      display: flex;
      align-items: center;
      color: var(--text-muted);
      gap: 6px;
    }

    .view-btn {
      color: var(--text-main);
      font-size: .9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      transition: all var(--transition)
    }

    .view-btn svg {
      transition: transform 0.2s;
    }

    .card:hover .view-btn svg {
      transform: translateX(4px)
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: transparent;
    }

    .pagination-container {
      max-width: 1200px;
      margin: 0 auto 80px;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      gap: 20px;
      min-height: 50px
    }

    .pagination-container.hidden {
      display: none
    }

    .pagination-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: .9rem;
      font-weight: 600;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 8px
    }

    .pagination-btn:hover:not(:disabled) {
      background: var(--bg-card-hover);
      border-color: var(--text-main);
    }

    .pagination-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      filter: grayscale(1)
    }

    .pagination-info {
      font-size: .95rem;
      color: var(--text-muted);
      font-weight: 500
    }

    .pagination-info span {
      color: var(--text-main);
      font-weight: 700
    }

    footer {
      padding: 60px 20px;
      border-top: 1px solid var(--border);
      text-align: center
    }

    .f-links {
      margin-bottom: 24px
    }

    .f-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: .85rem;
      margin: 0 16px;
      transition: color 0.2s
    }

    .f-links a:hover {
      color: var(--text-main)
    }

    .copy {
      font-size: .85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ─── THEME DOTS (mirrors index.html) ─── */
    .theme-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      cursor: pointer;
      transition: border-color .2s, transform .2s;
      flex-shrink: 0;
    }

    .theme-dot:hover {
      transform: scale(1.2);
    }

    .theme-dot[data-t="light"] { background: #fcfcfc; }
    .theme-dot[data-t="sepia"] { background: #f5efe3; }
    .theme-dot[data-t="dark"]  { background: #141414; }

    .theme-dot.active {
      border-color: var(--accent);
      border-width: 2px;
    }

    .grid-container.loading .skeleton-card {
      display: flex
    }

    .grid-container.loading .card {
      display: none
    }

    /* Redesigned Skeletons */
    .skeleton-card {
      background: transparent;
      padding: 24px 0 0 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 240px;
    }

    .skel-line {
      background: var(--border);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    .skel-line::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      transform: translateX(-100%);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
      animation: shimmer 1.5s infinite
    }

    [data-theme="light"] .skel-line::after,
    [data-theme="sepia"] .skel-line::after {
      background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.06), transparent);
    }

    @keyframes shimmer {
      100% {
        transform: translateX(100%)
      }
    }

    .skel-tag {
      height: 12px;
      width: 35%;
      margin-bottom: 6px;
    }

    .skel-t1 {
      height: 22px;
      width: 95%;
    }

    .skel-t2 {
      height: 22px;
      width: 65%;
      margin-bottom: 12px;
    }

    .skel-p1 {
      height: 14px;
      width: 100%;
    }

    .skel-p2 {
      height: 14px;
      width: 80%;
    }

    @media (max-width:640px) {
      .controls-container {
        flex-direction: column
      }

      .search-input,
      .filter-select {
        width: 100%;
        max-width: none
      }

      .grid-container {
        gap: 40px 24px;
      }

      .hero h1 {
        font-size: 2.2rem
      }

      .card-title {
        font-size: 1.5rem;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* Make hover indent subtle on mobile */
      .card:hover>* {
        transform: translateX(4px);
      }

      .fab {
        bottom: 24px;
        right: 24px;
      }

    }
  </style>
</head>

<body>

  <header>
    <nav>
      <a href="#" class="logo">PDBA Blog</a>
      <div class="nav-links">
        <a href="index.html" id="archive">Archive</a>
      </div>
    </nav>
  </header>

  <main>
    <div id="filterModal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Search & Filter</h2>
          <button id="closeModal" class="close-btn" aria-label="Close Filters">✕</button>
        </div>

        <section class="controls-container">
          <input type="search" id="searchInput" class="search-input" placeholder="Search classics, authors, themes...">

          <select id="topicFilter" class="filter-select" aria-label="Select Genre">
            <option value="all">All Topics</option>
            <option value="Author Page">Author Page</option>
            <option value="Book Summary">Book Summary</option>
            <option value="Book to Read">Book to Read</option>
          </select>

          <button id="applyFilters" class="apply-btn">Apply Filters</button>
        </section>
      </div>
    </div>

    <section class="grid-container" id="blogGrid">
      <div class="skeleton-card">
        <div class="skel-line skel-tag"></div>
        <div class="skel-line skel-t1"></div>
        <div class="skel-line skel-t2"></div>
        <div class="skel-line skel-p1"></div>
        <div class="skel-line skel-p2"></div>
      </div>
      <div class="skeleton-card">
        <div class="skel-line skel-tag"></div>
        <div class="skel-line skel-t1"></div>
        <div class="skel-line skel-t2"></div>
        <div class="skel-line skel-p1"></div>
        <div class="skel-line skel-p2"></div>
      </div>
      <div class="skeleton-card">
        <div class="skel-line skel-tag"></div>
        <div class="skel-line skel-t1"></div>
        <div class="skel-line skel-t2"></div>
        <div class="skel-line skel-p1"></div>
        <div class="skel-line skel-p2"></div>
      </div>
      <div class="skeleton-card">
        <div class="skel-line skel-tag"></div>
        <div class="skel-line skel-t1"></div>
        <div class="skel-line skel-t2"></div>
        <div class="skel-line skel-p1"></div>
        <div class="skel-line skel-p2"></div>
      </div>
      <div class="skeleton-card">
        <div class="skel-line skel-tag"></div>
        <div class="skel-line skel-t1"></div>
        <div class="skel-line skel-t2"></div>
        <div class="skel-line skel-p1"></div>
        <div class="skel-line skel-p2"></div>
      </div>
      <div class="skeleton-card">
        <div class="skel-line skel-tag"></div>
        <div class="skel-line skel-t1"></div>
        <div class="skel-line skel-t2"></div>
        <div class="skel-line skel-p1"></div>
        <div class="skel-line skel-p2"></div>
      </div>
    </section>

    <div id="pagination" class="pagination-container">
      <button class="pagination-btn" id="prevPage">PREV</button>
      <div class="pagination-info">
        Page <span id="currentPageNum">1</span> of <span id="totalPageNum">1</span>
      </div>
      <button class="pagination-btn" id="nextPage">NEXT</button>
    </div>

    <button id="filterFab" class="fab" aria-label="Open Filters">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
      </svg>
    </button>
  </main>

  <footer>
    <div class="f-links">
      <a href="pages/about.html">About</a>
      <a href="pages/contact.html">Contact</a>
      <a href="pages/privacy.html">Privacy</a>
      <a href="pages/terms.html">Terms</a>
    </div>

    <p class="copy">&copy; <span id="year"></span> PDBA Blog. ALL RIGHTS RESERVED.</p>

    <div class="theme-toggle-wrapper" style="margin-top:24px;display:flex;justify-content:center;gap:.35rem;">
      <button class="theme-dot" data-t="light" title="Light theme"></button>
      <button class="theme-dot" data-t="sepia" title="Sepia theme"></button>
      <button class="theme-dot" data-t="dark"  title="Dark theme"></button>
    </div>
  </footer>

  <script type="module">
    // --- DOM Elements ---
    const blogGrid = document.getElementById('blogGrid');
    const searchInput = document.getElementById('searchInput');
    const topicFilter = document.getElementById('topicFilter');
    const paginationContainer = document.getElementById('pagination');
    document.getElementById("year").innerHTML = new Date().getFullYear();
    const arrowIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>`;
    const dateIcon = `<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>`;

    // --- Global State ---
    let currentPage = 1;
    const itemsPerPage = 6;
    let filteredDataGlobal = [];
    let currentBlogs = [];

    // --- Dynamic Data Loader ---
    async function loadBlogData() {
      blogGrid.classList.add('loading');
      try {
        const module = await import(`/blog-data/blogs.js`);
        currentBlogs = module.default;
        handleFilters();
      } catch (error) {
        console.error("Error loading library data:", error);
        blogGrid.classList.remove('loading');
        blogGrid.innerHTML = `
          <div class="no-results">
            <h3>Failed to load database</h3>
            <p style="margin-top: 8px;">Could not load blog data.</p>
          </div>`;
      }
    }

    // --- Render Function ---
    function renderBlogs(data) {
      blogGrid.classList.remove('loading');
      blogGrid.innerHTML = '';

      if (data.length === 0) {
        blogGrid.innerHTML = `
          <div class="no-results">
            <h3>No entries found</h3>
            <p style="margin-top: 8px;">Try adjusting your search query or selected filter.</p>
          </div>
        `;
        return;
      }

      data.forEach(blog => {
        const card = document.createElement('a');
        card.href = blog.link;
        card.className = 'card';

        card.innerHTML = `
          <div class="card-header">
            <span class="category-tag">${blog.category}</span>
          </div>
          
          <h2 class="card-title">${blog.title}</h2>
          
          <p class="card-excerpt">${blog.excerpt}</p>

          <div class="card-footer">
            <span class="published-tag">${dateIcon} ${blog.published}</span>
            <span class="view-btn">Read ${arrowIcon}</span>
          </div>
        `;
        blogGrid.appendChild(card);
      });
    }

    // --- Filter Logic ---
    function handleFilters() {
      const searchTerm = searchInput.value.toLowerCase();
      const selectedTopic = topicFilter.value.toLowerCase();

      const filtered = currentBlogs.filter(blog => {
        const matchesSearch =
          blog.title.toLowerCase().includes(searchTerm) ||
          blog.excerpt.toLowerCase().includes(searchTerm) ||
          blog.category.toLowerCase().includes(searchTerm);

        const matchesTopic = selectedTopic === 'all' || blog.category.toLowerCase().includes(selectedTopic);
        return matchesSearch && matchesTopic;
      });

      filteredDataGlobal = filtered.reverse();
      currentPage = 1;
      updateDisplay();
    }

    function updateDisplay() {
      const totalPages = Math.ceil(filteredDataGlobal.length / itemsPerPage);
      const startIndex = (currentPage - 1) * itemsPerPage;
      const paginatedData = filteredDataGlobal.slice(startIndex, startIndex + itemsPerPage);

      renderBlogs(paginatedData);
      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const prevBtn = document.getElementById('prevPage');
      const nextBtn = document.getElementById('nextPage');
      const currentPageSpan = document.getElementById('currentPageNum');
      const totalPageSpan = document.getElementById('totalPageNum');

      currentPageSpan.textContent = currentPage;
      totalPageSpan.textContent = totalPages;

      if (totalPages <= 1) {
        paginationContainer.classList.add('hidden');
        return;
      }

      paginationContainer.classList.remove('hidden');
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages;

      prevBtn.onclick = () => {
        currentPage--;
        updateDisplay();
        window.scrollTo({ top: 0 });
      };

      nextBtn.onclick = () => {
        currentPage++;
        updateDisplay();
        window.scrollTo({ top: 0 });
      };
    }

    // --- Event Listeners ---
    searchInput.addEventListener('input', handleFilters);
    topicFilter.addEventListener('change', handleFilters);

    // Initial Render
    loadBlogData();

    /* ─── THEME DOTS ─── */
    const PREFS_KEY = 'reader_prefs';
    const htmlEl = document.documentElement;

    function applyTheme(theme) {
      htmlEl.setAttribute('data-theme', theme);
      document.querySelectorAll('.theme-dot').forEach(d =>
        d.classList.toggle('active', d.dataset.t === theme));
    }

    function loadTheme() {
      const saved = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
      applyTheme(saved.theme || 'light');
    }

    document.querySelectorAll('.theme-dot').forEach(btn => {
      btn.addEventListener('click', () => {
        const saved = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
        saved.theme = btn.dataset.t;
        localStorage.setItem(PREFS_KEY, JSON.stringify(saved));
        applyTheme(btn.dataset.t);
      });
    });

    loadTheme();

    // --- Modal Logic ---
    const filterModal = document.getElementById('filterModal');
    const filterFab = document.getElementById('filterFab');
    const closeModal = document.getElementById('closeModal');

    // Function to toggle modal visibility
    function toggleModal() {
      filterModal.classList.toggle('hidden');

      // Focus the search input automatically when opening
      if (!filterModal.classList.contains('hidden')) {
        setTimeout(() => {
          document.getElementById('searchInput').focus();
        }, 100);
      }
    }

    // Open modal via FAB
    filterFab.addEventListener('click', toggleModal);

    // Close modal via close button
    closeModal.addEventListener('click', toggleModal);

    // Close modal when clicking outside the content box
    filterModal.addEventListener('click', (e) => {
      if (e.target === filterModal) {
        toggleModal();
      }
    });

    // Close modal on Escape key press
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !filterModal.classList.contains('hidden')) {
        toggleModal();
      }
    });

    // Apply button click
    const applyBtn = document.getElementById('applyFilters');
    applyBtn.addEventListener('click', () => {
      handleFilters(); // Run the search logic
      toggleModal(); // Close the modal
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && searchInput.value.trim() !== "") {
        handleFilters();
        toggleModal();
      }
    });
  </script>
</body>

</html>
